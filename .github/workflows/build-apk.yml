name: Gerar APK de teste

# Roda sozinho quando voce sobe arquivos, e tambem da para rodar
# manualmente em Actions -> "Gerar APK de teste" -> Run workflow.
#
# Quando terminar, o APK fica em "Artifacts" na pagina da execucao.
# Baixe, instale no Android e veja as telas.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar os arquivos do repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Localizar o projeto pela pasta app_src
        run: |
          APPSRC=$(find . -type d -name app_src -not -path './.git/*' | head -1)
          SRC=$(dirname "$APPSRC")
          echo "Projeto encontrado em: $SRC"
          if [ "$SRC" != "." ]; then
            cp -r "$SRC"/. .
          fi
          ls -la

      - name: Criar a estrutura Android
        run: flutter create . --org com.mindi --project-name printer_preview --platforms=android

      - name: Liberar internet e ajustar o nome do app
        run: |
          python3 - <<'EOF'
          import re
          caminho = 'android/app/src/main/AndroidManifest.xml'
          xml = open(caminho, encoding='utf-8').read()
          if 'android.permission.INTERNET' not in xml:
              i = xml.index('>', xml.index('<manifest')) + 1
              xml = xml[:i] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + xml[i:]
          xml = re.sub(r'android:label="[^"]*"',
                       'android:label="Mindi Printer (teste)"', xml, count=1)
          open(caminho, 'w', encoding='utf-8').write(xml)
          print('manifest atualizado')
          EOF

      - name: Copiar as telas para dentro do projeto
        run: |
          mkdir -p lib
          cp app_src/*.dart lib/
          ls lib

      - name: Baixar os pacotes
        run: flutter pub get

      - name: Gerar o APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Publicar o APK para baixar
        uses: actions/upload-artifact@v4
        with:
          name: mindi-printer-teste-apk
          path: build/app/outputs/flutter-apk/app-release.apk
